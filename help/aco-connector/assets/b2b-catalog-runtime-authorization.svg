<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Runtime authorization for B2B catalog requests</title>
  <desc id="desc">A buyer's request passes through the storefront to a Commerce backend. The backend authenticates the buyer, resolves the company catalog context, and signs a JWT. Adobe Commerce Optimizer validates the token and returns authorized catalog data. Commerce continues to handle transactions.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1473e6" />
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #292929; }
      .title { font-size: 23px; font-weight: 700; }
      .heading { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #505050; }
      .box { fill: #f7f7f7; stroke: #b8b8b8; stroke-width: 1.5; }
      .commerce { fill: #e5f4ed; stroke: #268e6c; stroke-width: 1.5; }
      .optimizer { fill: #efedfc; stroke: #6d63c7; stroke-width: 1.5; }
      .line { fill: none; stroke: #1473e6; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    </style>
  </defs>
  <rect width="900" height="500" fill="#ffffff" />
  <text class="title" x="30" y="38">Runtime authorization for B2B catalog requests</text>

  <rect class="box" x="30" y="72" width="150" height="92" rx="12" />
  <text class="heading" x="105" y="108" text-anchor="middle">Buyer</text>
  <text class="small" x="105" y="132" text-anchor="middle">authenticated</text>

  <rect class="box" x="230" y="72" width="155" height="92" rx="12" />
  <text class="heading" x="307" y="108" text-anchor="middle">Storefront</text>
  <text class="small" x="307" y="132" text-anchor="middle">sends catalog request</text>

  <rect class="commerce" x="435" y="62" width="220" height="185" rx="12" />
  <text class="heading" x="545" y="91" text-anchor="middle">Commerce backend</text>
  <text class="body" x="453" y="121">Authenticates the session</text>
  <text class="body" x="453" y="151">Resolves company, shared</text>
  <text class="body" x="453" y="171">catalog, catalog view, and</text>
  <text class="body" x="453" y="191">price book</text>
  <text class="body" x="453" y="221">Signs an RS256 JWT</text>

  <rect class="optimizer" x="705" y="62" width="165" height="185" rx="12" />
  <text class="heading" x="787" y="102" text-anchor="middle">Adobe Commerce</text>
  <text class="heading" x="787" y="124" text-anchor="middle">Optimizer</text>
  <text class="small" x="787" y="176" text-anchor="middle">Validates JWT against</text>
  <text class="small" x="787" y="194" text-anchor="middle">assigned public key</text>
  <text class="small" x="787" y="222" text-anchor="middle">Returns authorized data</text>

  <path class="line" d="M 180 118 L 222 118" />
  <path class="line" d="M 385 118 L 427 118" />
  <path class="line" d="M 655 147 L 697 147" />
  <path class="line" d="M 704 232 C 625 276 376 276 307 172" />
  <text class="small" x="515" y="280" text-anchor="middle">Catalog response</text>

  <rect class="box" x="45" y="320" width="810" height="68" rx="10" />
  <text class="heading" x="65" y="348">Request headers for a protected catalog view</text>
  <text class="body" x="65" y="372">AC-View-ID · AC-Price-Book-ID · AC-Catalog-View-Access-Token</text>

  <rect class="commerce" x="45" y="412" width="390" height="62" rx="8" />
  <text class="heading" x="65" y="440">Protection boundary</text>
  <text class="small" x="65" y="460">Protects catalog and search requests only.</text>

  <rect class="box" x="465" y="412" width="390" height="62" rx="8" />
  <text class="heading" x="485" y="440">Transactions</text>
  <text class="small" x="485" y="460">Commerce handles cart, checkout, and orders.</text>
</svg>
